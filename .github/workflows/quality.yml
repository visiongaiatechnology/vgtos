name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: PHP tests, lint and static gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.1', '8.3', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, zip, sodium, json, mbstring
          coverage: none

      - name: PHP version
        run: php -v

      - name: Lint and line budget
        run: php tests/lint.php

      - name: Test suite
        run: php tests/run.php
